[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shielda-captcha"
version = "1.0.0"
authors = [
  { name="Shielda Team", email="support@shielda.ir" },
]
description = "Official Python SDK for Shielda Captcha (کتابخانه رسمی پایتون برای شیلدا کپچا)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["shielda", "captcha", "security", "bot-protection", "django", "fastapi", "flask", "iran"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
django = [
    "django>=3.2",
]

[project.urls]
"Homepage" = "https://shielda.ir"
"Documentation" = "https://shielda.ir/docs"
